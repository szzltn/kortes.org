:root{--navy:#0E1A2B;--paper:#F4F2EE;--amber:#F2B84B;--muted:#AEB8C6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--navy);color:var(--paper);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:48px 16px;text-align:center}
.logo{width:min(440px,80vw);height:auto;overflow:visible}
.word path{fill:var(--paper)}
.line{fill:none;stroke:var(--amber);stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s .3s cubic-bezier(.55,0,.25,1) forwards}
.dot{fill:var(--amber);opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s 2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.line{animation:none;stroke-dashoffset:0}.dot{animation:none;opacity:1}}
.tag{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:500;line-height:1.45;max-width:34ch}
.tag span{display:block;color:var(--muted);font-size:.8em;margin-top:6px}
.soon{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(244,242,238,.28);color:var(--paper);text-decoration:none;font-weight:700;font-size:15px;transition:background .2s,border-color .2s}
nav a:hover,nav a:focus-visible{background:rgba(244,242,238,.08);border-color:var(--amber);outline:none}
nav a.primary{background:var(--amber);border-color:var(--amber);color:var(--navy)}
nav a.primary:hover,nav a.primary:focus-visible{background:#F6C76C}
footer{padding:24px 16px;text-align:center;font-size:13px;color:var(--muted)}
